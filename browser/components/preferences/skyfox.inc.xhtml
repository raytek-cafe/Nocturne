<!-- Skyfox panel -->

<script src="chrome://browser/content/preferences/skyfox.js"/>

<!-- Skyfox -->
<html:template id="template-paneSkyfox">
<hbox id="skyfoxcategory"
      class="subcategory"
      hidden="true"
      data-category="paneSkyfox">
  <html:h1 data-l10n-id="skyfox-title"/>
</hbox>

<!-- Skyfox visual -->
<groupbox id="skyfoxVisualGroup"
          data-category="paneSkyfox"
          hidden="true">
  <label><html:h2 data-l10n-id="skyfox-visual-header"/></label>

  <hbox align="center">
    <checkbox id="skyfoxUseNativeStyles"
              data-l10n-id="skyfox-native-checkbox"
              preference="widget.non-native-theme.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-native-checkbox-desc"/>

  <hbox align="center">
    <label id="skyfoxNativeMenulist" data-l10n-id="skyfox-native-menulist" control="skyfoxNativeMenulistType"/>
    <menulist id="skyfoxNativeMenulistType" preference="browser.display.windows.non_native_menus">
      <menupopup>
        <menuitem label="Native menulists always" value="0"/>
        <menuitem label="Custom menulists always" value="1"/>
        <menuitem label="Native menulists unless Windows 10 (Modern) theme is used (Default)" value="2"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <label id="skyfoxNativeScroll" data-l10n-id="skyfox-native-scroll" control="skyfoxNativeScrollType"/>
    <menulist id="skyfoxNativeScrollType" preference="widget.native-controls.scrollbar-style">
      <menupopup>
        <menuitem label="Native scrollbars always" value="0"/>
        <menuitem label="Custom scrollbars always" value="1"/>
        <menuitem label="Native scrollbars unless the website has a dark color scheme (Default)" value="2"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <label id="skyfoxFakeScroll" data-l10n-id="skyfox-fake-scroll-type" control="skyfoxFakeScrollType"/>
    <menulist id="skyfoxFakeScrollType" preference="widget.non-native-theme.scrollbar.style">
      <menupopup>
        <menuitem label="Default platform scrollbar style (Default)" value="0"/>
        <menuitem label="macOS scrollbar (small)" value="1"/>
        <menuitem label="GTK scrollbar (smaller)" value="2"/>
        <menuitem label="Android scrollbar (smallest)" value="3"/>
        <menuitem label="Windows 10 scrollbar (normal)" value="4"/>
        <menuitem label="Windows 11 scrollbar (smaller)" value="5"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <label id="skyfoxWinTheme" data-l10n-id="skyfox-win-theme-type" control="skyfoxWinThemeType"/>
    <menulist id="skyfoxWinThemeType" preference="widget.native-controls.override-win-version">
      <menupopup>
        <menuitem label="Current OS version (Default)" value="0"/>
        <menuitem label="Windows XP" value="5"/>
        <menuitem label="Windows Vista" value="6"/>
        <menuitem label="Windows 7" value="7"/>
        <menuitem label="Windows 8" value="8"/>
        <menuitem label="Windows 10 (Modern)" value="10"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <label id="skyfoxColors" data-l10n-id="skyfox-colors" control="skyfoxColorsType"/>
    <menulist id="skyfoxColorsType" preference="skyfox.colors">
      <menupopup>
        <menuitem label="Disabled (Stock Firefox Blue)" value="0"/>
        <menuitem label="Red" value="1"/>
        <menuitem label="Orange" value="2"/>
        <menuitem label="Pink" value="3"/>
        <menuitem label="Dark Theme Purple" value="4"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxdrag"
              data-l10n-id="skyfox-drag"
              preference="skyfox.drag-space.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxBackgrounds"
              data-l10n-id="skyfox-backgrounds"
              preference="skyfox.backgrounds.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxMenubar"
              data-l10n-id="skyfox-menubar"
              preference="skyfox.transparent.menubar"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxNavbar"
              data-l10n-id="skyfox-navbar"
              preference="skyfox.translucent.navbar"/>
  </hbox>

  <hbox align="center">
    <label id="skyfoxFog" data-l10n-id="skyfox-fog-type" control="skyfoxFogType"/>
    <menulist id="skyfoxFogType" preference="skyfox.aero.fog">
      <menupopup>
        <menuitem label="Disabled (Default with backgrounds enabled)" value="0"/>
        <menuitem label="Skyfox style (covers menubar)" value="1"/>
        <menuitem label="Stock Firefox style" value="2"/>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <label id="skyfoxCaptionText" data-l10n-id="skyfox-caption-text" control="skyfoxCaptionTextType"/>
    <menulist id="skyfoxCaptionTextType" preference="skyfox.caption.text.color">
      <menupopup>
        <menuitem label="Default platform style (Default)" value="0"/>
        <menuitem label="White" value="1"/>
        <menuitem label="Black" value="2"/>
      </menupopup>
    </menulist>
  </hbox>
</groupbox>

<!-- Skyfox functional -->
<groupbox id="skyfoxFunctionalGroup"
          data-category="paneSkyfox"
          hidden="true">
  <label><html:h2 data-l10n-id="skyfox-functional-header"/></label>
  
      <hbox align="center">
    <checkbox id="skyfoxprefsxul"
              data-l10n-id="skyfox-xul-preferences"
              preference="browser.preferences.inContent"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-xul-preferences-desc"/>
  
      <hbox align="center">
    <checkbox id="skyfoxoldwoc"
              data-l10n-id="skyfox-old-warn-on-close"
              preference="skyfox.tabs.oldWarnOnClose"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-old-warn-on-close-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxoneoffs"
              data-l10n-id="skyfox-one-offs"
              preference="browser.urlbar.oneOffsInstant"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxviewimage"
              data-l10n-id="skyfox-view-image"
              preference="skyfox.view.image"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxnavtext"
              data-l10n-id="skyfox-nav-text"
              preference="browser.menu.navigationIcons"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxtabgroups"
              data-l10n-id="skyfox-tab-groups"
              preference="browser.tabs.groups.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxtranslationsenable"
              data-l10n-id="skyfox-translations-enable"
              preference="browser.translations.enable"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxscreenshotcomponent"
              data-l10n-id="skyfox-screenshot-component"
              preference="screenshots.browser.component.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxhoverpreview"
              data-l10n-id="skyfox-hover-preview"
              preference="browser.tabs.hoverPreview.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxdroptopin"
              data-l10n-id="skyfox-drop-to-pin"
              preference="browser.tabs.dropToPin.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxtaskbartabs"
              data-l10n-id="skyfox-taskbar-tabs"
              preference="browser.taskbarTabs.enabled"/>
  </hbox>

  <hbox align="center">
    <checkbox id="skyfoxaboutconfig"
              data-l10n-id="skyfox-old-aboutconfig"
              preference="skyfox.ui.oldaboutconfig"/>
  </hbox>

    <hbox align="center">
    <checkbox id="skyfoxff68downloadicons"
              data-l10n-id="skyfox-ff68-download-icons"
              preference="skyfox.ui.ff68downloadicons"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-ff68-download-icons-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxswitchtotab"
              data-l10n-id="skyfox-switch-to-tab"
              preference="browser.urlbar.secondaryActions.switchToTab"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-switch-to-tab-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxlegacyicon"
              data-l10n-id="skyfox-legacy-icon"
              preference="skyfox.legacyiconbehavior.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-legacy-icon-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxsmallicon"
              data-l10n-id="skyfox-small-icon"
              preference="skyfox.smalliconbehavior.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-small-icon-desc"/>

    <hbox align="center">
    <checkbox id="skyfoxPromptSound"
              data-l10n-id="skyfox-prompt-sound"
              preference="prompts.tab_modal.sound.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-prompt-sound-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxPromptTabModal"
              data-l10n-id="skyfox-prompt-tab-modal"
              preference="prompts.tab_modal.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-prompt-tab-modal-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxPromptHeaderIcon"
              data-l10n-id="skyfox-prompt-header-icon"
              preference="prompts.headerAppIcon.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-prompt-header-icon-desc"/>
  
</groupbox>

<!-- Skyfox advanced -->
<groupbox id="skyfoxAdvancedGroup"
          data-category="paneSkyfox"
          hidden="true">
  <label><html:h2 data-l10n-id="skyfox-advanced-header"/></label>

  <hbox align="center">
    <label id="skyfoxAccessibility" data-l10n-id="skyfox-accessibility" control="skyfoxAccessibilityType"/>
    <menulist id="skyfoxAccessibilityType" preference="accessibility.force_disabled">
      <menupopup>
        <menuitem label="Always disabled (1)" value="1"/>
        <menuitem label="Default (0)" value="0"/>
        <menuitem label="Always enabled (-1)" value="-1"/>
      </menupopup>
    </menulist>
  </hbox>
  <description id="skyfoxAccessibilityDescription" class="tip-caption" data-l10n-id="skyfox-accessibility-desc"/>

  <hbox align="center">
    <label id="skyfoxCookieBanners" data-l10n-id="skyfox-cookiebanners" control="skyfoxCookieBannersType"/>
    <menulist id="skyfoxCookieBannersType" preference="cookiebanners.service.mode">
      <menupopup>
        <menuitem label="Auto reject all cookies where possible" value="1"/>
        <menuitem label="Disable all cookie banner handling" value="0"/>
      </menupopup>
    </menulist>
  </hbox>
  <description id="skyfoxCookieBannersDescription" class="tip-caption" data-l10n-id="skyfox-cookiebanners-desc"/>

  <hbox align="center">
    <label id="skyfoxCookieBannersPrivate" data-l10n-id="skyfox-cookiebanners-private" control="skyfoxCookieBannersPrivateType"/>
    <menulist id="skyfoxCookieBannersPrivateType" preference="cookiebanners.service.mode.privateBrowsing">
      <menupopup>
        <menuitem label="Auto reject all cookies where possible" value="1"/>
        <menuitem label="Disable all cookie banner handling" value="0"/>
      </menupopup>
    </menulist>
  </hbox>
  <description id="skyfoxCookieBannersPrivateDescription" class="tip-caption" data-l10n-id="skyfox-cookiebanners-desc"/>

  <hbox align="center">
    <label id="skyfoxSandboxLevel" data-l10n-id="skyfox-sandbox-level" control="skyfoxSandboxLevelType"/>
    <menulist id="skyfoxSandboxLevelType" preference="security.sandbox.content.level">
      <menupopup>
        <menuitem label="Increased (20)" value="20"/>
        <menuitem label="Default (8)" value="8"/>
        <menuitem label="Lower (7)" value="7"/>
      </menupopup>
    </menulist>
  </hbox>
  <description id="skyfoxSandboxLevelDescription" class="tip-caption" data-l10n-id="skyfox-sandbox-level-desc"/>

  <hbox align="center">
    <label id="skyfoxCaptionWidth" data-l10n-id="skyfox-caption-width" control="skyfoxCaptionWidthType"/>
    <html:input id="skyfoxCaptionWidthType" type="number" class="option" data-type="int" preference="widget.native-controls.override-aero-caption-buttons-mask-width"/>
  </hbox>
  <description id="skyfoxCaptionWidthDescription" class="tip-caption" data-l10n-id="skyfox-caption-desc"/>

  <hbox align="center">
    <label id="skyfoxCaptionHeight" data-l10n-id="skyfox-caption-height" control="skyfoxCaptionWidthType"/>
    <html:input id="skyfoxCaptionHeightType" type="number" class="option" data-type="int" preference="widget.native-controls.override-aero-caption-buttons-mask-height"/>
  </hbox>
  <description id="skyfoxCaptionHeighteDescription" class="tip-caption" data-l10n-id="skyfox-caption-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxwebaudio"
              data-l10n-id="skyfox-webaudio"
              preference="dom.webaudio.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-webaudio-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxcsp"
              data-l10n-id="skyfox-csp"
              preference="security.csp.enable"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-csp-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxcorsbase"
              data-l10n-id="skyfox-cors-base"
              preference="content.cors.disable"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-cors-base-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxcorspreflight"
              data-l10n-id="skyfox-cors-preflight"
              preference="content.cors.bypass_preflight_request"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-cors-preflight-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxhsts"
              data-l10n-id="skyfox-hsts"
              preference="network.stricttransportsecurity.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-hsts-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxsameorigin"
              data-l10n-id="skyfox-same-origin"
              preference="security.same_origin_policy.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-same-origin-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxportblocking"
              data-l10n-id="skyfox-port-blocking"
              preference="security.port.blocking.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-port-blocking-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxe10s"
              data-l10n-id="skyfox-e10s"
              preference="browser.e10s.disabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-e10s-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxdwrite"
              data-l10n-id="skyfox-dwrite"
              preference="gfx.dwrite.enabled"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-dwrite-desc"/>

  <hbox align="center">
    <checkbox id="skyfoxoldurlbar"
              data-l10n-id="skyfox-old-urlbar"
              preference="skyfox.ui.oldurlbar"/>
  </hbox>
  <description class="indent tip-caption" data-l10n-id="skyfox-old-urlbar-desc"/>
</groupbox>
</html:template>
