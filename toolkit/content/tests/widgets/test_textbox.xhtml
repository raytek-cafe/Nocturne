<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin" type="text/css"?> <?xml-stylesheet
href="chrome://mochikit/content/tests/SimpleTest/test.css" type="text/css"?>

<window
  title="Textbox Tests"
  onload="runTest()"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
>
  <script src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js" />
  <script>
    SimpleTest.waitForExplicitFinish();

    function runTest() {
      const textbox = document.getElementById("textbox");
      const textarea = document.getElementById("textarea");

      ok(customElements.get("textbox"), "textbox is registered");
      ok(customElements.get("textarea"), "textarea is registered");
      is(textbox.inputField.localName, "input", "textbox wraps an input");
      is(textbox.value, "Initial", "textbox inherits its value");
      textbox.value = "Updated";
      is(textbox.inputField.value, "Updated", "textbox value is writable");
      textbox.placeholder = "Hint";
      is(
        textbox.inputField.placeholder,
        "Hint",
        "textbox placeholder is writable"
      );
      is(
        textarea.inputField.localName,
        "textarea",
        "textarea wraps a textarea"
      );
      textarea.value = "Text area";
      is(textarea.inputField.value, "Text area", "textarea value is writable");

      SimpleTest.finish();
    }
  </script>

  <textbox id="textbox" value="Initial" />
  <textarea id="textarea" />
</window>
