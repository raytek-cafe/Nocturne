name: "Bug report"
description: Experiencing issues with Nocturne? Let us know here.
labels: [bug]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > Please fill out this document according to the format, otherwise I will simply close the issue.

  - type: checkboxes
    attributes:
      label: Before reporting your issue
      description: Please ensure you meet the following criteria before reporting issues
      options:
        - label: I'm on the latest version of Nocturne.
        - label: I have read the pinned issue and confirmed that this is a Nocturne issue.


  - type: input
    attributes:
      label: What Operating System are you using the browser on?
      description: "Example: Windows 10 LTSC 2021 21H2 19044.5011 (INCLUDE TRANSFORMATION PACKS IF HAVE ANY)"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Summarise the issue
      description: Provide a clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots to help illustrate the issue
      placeholder: Drop or paste images or videos to upload.

  - type: textarea
    attributes:
      label: How do you reproduce the bug?
      description: List the steps to reproduce the issue
      placeholder: "1.\n2.\n3.\n4. ..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context about the problem here, such as frequency of the issue, etc.
